<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jmind - 设置</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230A84FF'/><text x='50' y='68' font-size='55' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>J</text></svg>">
</head>
<body>
    <div class="settings-container">
        <a href="index.html" class="back-link">← 返回首页</a>

        <div class="settings-header">
            <h1>⚙️ 设置</h1>
        </div>

        <!-- 外观模式：浅色 / 深色 -->
        <div class="setting-group">
            <label>
                外观模式
                <div class="setting-desc">选择浅色或深色界面，可与下方主题色自由搭配</div>
            </label>
            <div class="mode-options" id="mode-options">
                <div class="mode-option" data-mode="light">
                    <span class="mode-icon">☀️</span>
                    <span class="mode-name">浅色</span>
                </div>
                <div class="mode-option" data-mode="dark">
                    <span class="mode-icon">🌙</span>
                    <span class="mode-name">深色</span>
                </div>
            </div>
        </div>

        <!-- 主题色 -->
        <div class="setting-group">
            <label>
                主题色
                <div class="setting-desc">选择界面的强调颜色</div>
            </label>
            <div class="accent-options" id="accent-options">
                <div class="accent-swatch" data-accent="blue"   style="--sw:#0A84FF" title="蓝色"></div>
                <div class="accent-swatch" data-accent="green"  style="--sw:#16a34a" title="绿色"></div>
                <div class="accent-swatch" data-accent="pink"   style="--sw:#ec4899" title="粉色"></div>
                <div class="accent-swatch" data-accent="purple" style="--sw:#8b5cf6" title="紫色"></div>
                <div class="accent-swatch" data-accent="orange" style="--sw:#f97316" title="橙色"></div>
            </div>
        </div>

        <!-- 语言 -->
        <div class="setting-group">
            <label>
                语言 / Language
                <div class="setting-desc">界面语言设置（多语言支持开发中）</div>
            </label>
            <div class="language-options" id="language-options">
                <div class="language-option" data-lang="zh">中文</div>
                <div class="language-option" data-lang="en">English</div>
            </div>
        </div>

        <!-- 数据管理 -->
        <div class="data-section">
            <h3>📦 数据管理</h3>
            <p>所有数据均存储在你的浏览器本地（localStorage），不会上传到任何服务器。</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-ghost" id="btn-export-data">📤 导出备份</button>
                <button class="btn btn-danger" id="btn-clear-data">🗑️ 清除所有数据</button>
            </div>
        </div>

        <!-- 操作 -->
        <div class="actions">
            <button class="btn" id="btn-save">完成</button>
        </div>

        <!-- 关于 -->
        <div class="about-section">
            <div class="app-name">jmind</div>
            <div class="version" id="app-version">v1.0.0</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/storage.js"></script>
    <script src="js/settings-app.js"></script>
</body>
</html>
