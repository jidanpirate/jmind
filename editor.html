<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>jmind - 编辑器</title>
    <link rel="stylesheet" href="css/common.css?v=1.4.3">
    <link rel="stylesheet" href="css/editor.css?v=1.4.3">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230A84FF'/><text x='50' y='68' font-size='55' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>J</text></svg>">
</head>
<body>
    <div id="app">
        <!-- 工具栏 -->
        <div class="toolbar" id="toolbar">
            <div class="logo" id="btn-back" data-i18n-title="back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                jmind
            </div>
            <div class="divider"></div>
            <button id="btn-save" class="primary" data-i18n-title="save_title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                <span class="label" data-i18n="save">保存</span>
            </button>
            <button id="btn-undo" data-i18n-title="undo_title">↶ <span class="label" data-i18n="undo">撤销</span></button>
            <button id="btn-redo" data-i18n-title="redo_title">↷ <span class="label" data-i18n="redo">重做</span></button>
            <div class="divider"></div>
            <button id="btn-add-child" data-i18n-title="add_child_title">＋ <span class="label" data-i18n="add_child">子节点</span></button>
            <button id="btn-add-sibling" data-i18n-title="add_sibling_title">↔ <span class="label" data-i18n="add_sibling">兄弟</span></button>
            <button id="btn-edit" data-i18n-title="edit_title">✏️ <span class="label" data-i18n="edit">编辑</span></button>
            <button id="btn-font" data-i18n-title="font_title">🅰️ <span class="label" data-i18n="font">字体</span></button>
            <button id="btn-delete" class="danger" data-i18n-title="delete_title">✕ <span class="label" data-i18n="delete">删除</span></button>
            <div class="divider"></div>
            <button id="btn-collapse" data-i18n-title="collapse_title">▾ <span class="label" data-i18n="collapse">折叠</span></button>
            <button id="btn-search" data-i18n-title="search_title">🔍</button>
            <button id="btn-outline" data-i18n-title="outline_title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                <span class="label" data-i18n="outline">大纲</span>
            </button>
            <div class="divider"></div>
            <button id="btn-zoom-in" title="放大 (+)">＋</button>
            <button id="btn-zoom-out" title="缩小 (-)">－</button>
            <button id="btn-fit" title="适应画布 (0)">⤢</button>
            <div class="divider"></div>
            <button id="btn-export" data-i18n-title="export_title">📄 <span class="label" data-i18n="export">导出</span></button>
            <button id="btn-export-png" data-i18n-title="export_png_title">🖼️ <span class="label">PNG</span></button>
            <div class="spacer"></div>
            <div class="save-status" id="save-status">
                <span class="dot"></span>
                <span class="text" data-i18n="saved">已保存</span>
            </div>
            <div class="divider"></div>
            <button id="btn-clear" class="danger" data-i18n-title="clear_title">🗑️ <span class="label" data-i18n="clear">清屏</span></button>
        </div>

        <!-- 画布 -->
        <div class="canvas-container" id="canvas-container">
            <canvas id="canvas"></canvas>

            <!-- 浮动字体面板 -->
            <div class="font-toolbar" id="font-toolbar">
                <button type="button" class="font-tool-btn font-tool-btn-bold" data-font-prop="bold" title="加粗"><b>B</b></button>
                <button type="button" class="font-tool-btn font-tool-btn-italic" data-font-prop="italic" title="斜体"><i>I</i></button>
                <button type="button" class="font-tool-btn font-tool-btn-underline" data-font-prop="underline" title="下划线"><u>U</u></button>
                <div class="font-tool-divider"></div>
                <select class="font-tool-select" id="font-tool-size" title="字号">
                    <option value="12">12</option>
                    <option value="14" selected>14</option>
                    <option value="16">16</option>
                    <option value="18">18</option>
                    <option value="20">20</option>
                    <option value="24">24</option>
                    <option value="32">32</option>
                </select>
                <select class="font-tool-select" id="font-tool-family" title="字体">
                    <option value="default">默认</option>
                    <option value="song">宋体</option>
                    <option value="hei">黑体</option>
                    <option value="kai">楷体</option>
                    <option value="mono">等宽</option>
                </select>
                <div class="font-tool-divider"></div>
                <div class="font-tool-color-wrapper">
                    <button type="button" class="font-tool-color-btn" id="font-tool-color-btn" title="文字颜色">
                        <span class="font-tool-color-icon">A</span>
                        <span class="font-tool-color-bar" id="font-tool-color-bar"></span>
                    </button>
                    <div class="font-tool-color-picker" id="font-tool-color-picker"></div>
                </div>
            </div>

            <!-- 节点浮动快捷菜单 -->
            <div class="node-popup" id="node-popup">
                <button class="popup-btn" data-popup-action="add-child" title="添加子节点 (Tab)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="popup-btn" data-popup-action="add-sibling" title="添加兄弟节点 (Enter)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                </button>
                <button class="popup-btn" data-popup-action="edit" title="编辑文本 (F2)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="popup-btn" data-popup-action="font" title="字体样式">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
                </button>
                <button class="popup-btn" data-popup-action="toggle-collapse" title="折叠/展开 (Space)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <button class="popup-btn" data-popup-action="duplicate" title="复制副本 (Ctrl+D)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <div class="popup-divider"></div>
                <button class="popup-btn danger" data-popup-action="delete" title="删除节点 (Del)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>

            <!-- 搜索栏 -->
            <div class="search-bar" id="search-bar">
                <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="搜索节点..." autocomplete="off">
                <span class="search-count" id="search-count"></span>
                <button class="search-nav-btn" id="search-prev" title="上一个 (Shift+Enter)">↑</button>
                <button class="search-nav-btn" id="search-next" title="下一个 (Enter)">↓</button>
                <button class="search-close" id="search-close" title="关闭 (Esc)">✕</button>
            </div>

            <!-- 大纲视图 -->
            <div class="outline-panel" id="outline-panel"></div>
        </div>

        <!-- 右键菜单 -->
        <div class="context-menu" id="context-menu">
            <div class="menu-item" data-action="add-child">➕ <span data-i18n="menu_add_child">添加子节点</span></div>
            <div class="menu-item" data-action="add-sibling">👥 <span data-i18n="menu_add_sibling">添加兄弟节点</span></div>
            <div class="menu-separator"></div>
            <div class="menu-item" data-action="edit">✏️ <span data-i18n="menu_edit_text">编辑文本</span></div>
            <div class="menu-item" data-action="change-color">🎨 <span data-i18n="menu_change_color">更改颜色</span></div>
            <div class="color-picker" id="color-picker"></div>
            <div class="menu-item" data-action="font-style">🅰️ <span data-i18n="menu_font_style">字体样式</span></div>
            <div class="font-panel" id="font-panel">
                <div class="font-toggles">
                    <button type="button" class="font-btn font-btn-bold" data-font-prop="bold" data-i18n-title="font_bold" title="粗体">B</button>
                    <button type="button" class="font-btn font-btn-italic" data-font-prop="italic" data-i18n-title="font_italic" title="斜体">I</button>
                    <button type="button" class="font-btn font-btn-underline" data-font-prop="underline" data-i18n-title="font_underline" title="下划线">U</button>
                </div>
                <label class="font-row">
                    <span data-i18n="font_size">字号</span>
                    <select id="font-size-select">
                        <option value="12">12</option>
                        <option value="14" selected>14</option>
                        <option value="16">16</option>
                        <option value="18">18</option>
                        <option value="20">20</option>
                        <option value="24">24</option>
                        <option value="32">32</option>
                    </select>
                </label>
                <label class="font-row">
                    <span data-i18n="font_family">字体</span>
                    <select id="font-family-select">
                        <option value="default" data-i18n="font_family_default">默认</option>
                        <option value="song" data-i18n="font_family_song">宋体</option>
                        <option value="hei" data-i18n="font_family_hei">黑体</option>
                        <option value="kai" data-i18n="font_family_kai">楷体</option>
                        <option value="mono" data-i18n="font_family_mono">等宽</option>
                    </select>
                </label>
            </div>
            <div class="menu-separator"></div>
            <div class="menu-item" data-action="toggle-collapse">🔽 <span data-i18n="menu_toggle_collapse">折叠/展开</span></div>
            <div class="menu-item" data-action="copy">📋 <span data-i18n="menu_copy">复制节点</span></div>
            <div class="menu-item" data-action="paste">📌 <span data-i18n="menu_paste">粘贴节点</span></div>
            <div class="menu-item" data-action="duplicate">📄 <span data-i18n="menu_duplicate">复制为副本</span></div>
            <div class="menu-separator"></div>
            <div class="menu-item danger" data-action="delete">🗑️ <span data-i18n="menu_delete">删除节点</span></div>
        </div>

        <!-- 拖拽指示 -->
        <div class="drop-indicator" id="drop-indicator"></div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-left">
                <span id="stats">节点: 0 | 缩放: 100%</span>
            </div>
            <div class="status-right">
                <kbd>Tab</kbd><span data-i18n="kbd_child">子</span>
                <kbd>Enter</kbd><span data-i18n="kbd_sibling">兄弟</span>
                <kbd>Del</kbd><span data-i18n="kbd_delete">删除</span>
                <kbd>F2</kbd><span data-i18n="kbd_edit">编辑</span>
                <kbd>Space</kbd><span data-i18n="kbd_fold">折叠</span>
                <kbd>Ctrl+Z</kbd><span data-i18n="kbd_undo">撤销</span>
                <kbd>Ctrl+F</kbd><span data-i18n="kbd_search">搜索</span>
            </div>
        </div>
    </div>

    <script src="js/storage.js?v=1.4.3"></script>
    <script src="js/i18n.js?v=1.4.3"></script>
    <script src="js/mindmap.js?v=1.4.3"></script>
    <script src="js/layout.js?v=1.4.3"></script>
    <script src="js/renderer.js?v=1.4.3"></script>
    <script src="js/outline.js?v=1.4.3"></script>
    <script src="js/dialog.js?v=1.4.3"></script>
    <script src="js/editor-app.js?v=1.4.3"></script>
</body>
</html>
